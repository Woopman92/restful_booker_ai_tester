name: Main API tests

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  api-tests:
    name: Main API tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v6

      # Temporary smoke check: the proposed revert must remove this step.
      - name: Simulate a failed main check for revert verification
        run: exit 1

      - name: Build image and run all tests
        run: make test

  propose-revert:
    name: Propose revert for review
    needs: api-tests
    if: ${{ always() && needs.api-tests.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: revert-main-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - name: Check out tested commit and history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create revert pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BEFORE_SHA: ${{ github.event.before }}
          FAILED_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/create-revert-pr.sh
