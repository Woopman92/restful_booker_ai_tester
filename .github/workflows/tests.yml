name: API tests

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Verify required check blocks merging
        run: exit 1

      - name: Build image and run all tests
        run: make test
